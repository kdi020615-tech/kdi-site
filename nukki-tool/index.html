<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nukki Tool</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="bar">
    <h1>Nukki Tool</h1>
    <p class="hint">영상 드롭 → 흰배경 누끼(외곽 flood fill) → 알파 webm</p>
  </header>

  <section id="drop" class="drop">
    <input id="file" type="file" accept="video/*" hidden />
    <button id="pick" type="button">영상 선택</button>
    <p class="drop-hint">또는 여기에 mp4/webm/mov 드롭</p>
  </section>

  <section id="status" class="status hidden"></section>

  <section id="result" class="result hidden">
    <div class="meta"></div>
    <div class="previews">
      <div class="preview dark">
        <span class="label">DARK #1a1a1a</span>
        <video class="out" autoplay loop muted playsinline></video>
      </div>
      <div class="preview cream">
        <span class="label">CREAM</span>
        <video class="out" autoplay loop muted playsinline></video>
      </div>
      <div class="preview grad">
        <span class="label">GRADIENT</span>
        <video class="out" autoplay loop muted playsinline></video>
      </div>
    </div>
    <div class="actions">
      <a id="download" class="btn primary" download>다운로드</a>
      <button id="reset" class="btn">새 영상</button>
    </div>
  </section>

  <script src="/script.js"></script>
</body>
</html>
