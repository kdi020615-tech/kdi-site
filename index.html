<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>KDI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=61" />
</head>
<body>
  <canvas id="sky"></canvas>

  <main class="stage">
    <img class="title" src="assets/static/kdi-title.png?v=61" alt="KDI" />

    <div class="hint hint-title">👉 눌러보세요!</div>
    <div class="hint hint-face">👉 캐릭터도 눌러봐!</div>

    <div class="orbit-system">
      <div class="faces">
        <div class="face-stack face-side" data-name="JYS">
          <video class="face-video" src="assets/avatars/jys-alpha.webm?v=61" loop muted playsinline preload="auto"></video>
        </div>
        <div class="face-stack face-main" data-name="KDI">
          <video class="face-video" src="assets/avatars/kdi-alpha.webm?v=61" loop muted playsinline preload="auto"></video>
        </div>
        <div class="face-stack face-side" data-name="MYR">
          <video class="face-video" src="assets/avatars/myr-alpha.webm?v=61" loop muted playsinline preload="auto"></video>
        </div>
      </div>
    </div>

  </main>

  <button class="email-btn" aria-label="이메일 복사">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"></rect>
      <path d="M2 7l10 7 10-7"></path>
    </svg>
    <span class="email-bubble">kimdoil2002@gmail.com</span>
  </button>

  <div class="toast" role="status" aria-live="polite">이메일이 복사됐어요</div>

  <script src="mobile-gate.js"></script>
  <script src="bgm.js?v=61"></script>
  <script src="script.js?v=61"></script>
</body>
</html>
