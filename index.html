<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>KDI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=64" />
</head>
<body>
  <canvas id="sky"></canvas>

  <main class="stage">
    <img class="title" src="assets/static/kdi-title.webp?v=64" alt="KDI" />

    <div class="hint hint-title">👉 눌러보세요!</div>
    <div class="hint hint-face">👉 캐릭터도 눌러봐!</div>

    <div class="orbit-system">
      <div class="faces">
        <div class="face-stack face-side" data-name="JYS">
          <video class="face-video" src="assets/avatars/jys-alpha.webm?v=64" loop muted playsinline preload="auto"></video>
        </div>
        <div class="face-stack face-main" data-name="KDI">
          <video class="face-video" src="assets/avatars/kdi-alpha.webm?v=64" loop muted playsinline preload="auto"></video>
        </div>
        <div class="face-stack face-side" data-name="MYR">
          <video class="face-video" src="assets/avatars/myr-alpha.webm?v=64" loop muted playsinline preload="auto"></video>
        </div>
      </div>
    </div>

  </main>

  <script src="mobile-gate.js"></script>
  <script src="bgm.js?v=64"></script>
  <script src="script.js?v=64"></script>
</body>
</html>
